name: Test @notesnook/web
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Install packages
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=web
    - name: Generate test build
      run: npm run build:test:web
    - name: Archive build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build
        path: apps/web/build/**/*
  test:
    needs: build
    name: 🧪 Test (${{ matrix.shard }}/${{ strategy.job-total }})
    strategy:
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
        - 5
    runs-on: ubuntu-latest
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG before-checkout"
        printf 'GERALT_DBG event=%s\n' "$GITHUB_EVENT_NAME"
        ref=${{ toJSON(github.event.pull_request.head.sha || github.ref) }}
        printf 'GERALT_DBG checkout_ref=%s\n' "$ref"
        headrepo=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        printf 'GERALT_DBG head_repo=%s\n' "$headrepo"
        base=${{ toJSON(github.repository) }}
        printf 'GERALT_DBG base_repo=%s\n' "$base"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: Download build
      uses: actions/download-artifact@v4
      with:
        name: build
        path: ./apps/web/build
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Install packages
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm install -D @playwright/test otplib dayjs @zip.js/zip.js
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
      working-directory: apps/web
    - name: Add environment variables
      run: |
        echo "USER_EMAIL=${{ secrets.USER_EMAIL }}" >> $GITHUB_ENV
        echo "USER_PASSWORD=${{ secrets.USER_PASSWORD }}" >> $GITHUB_ENV
        echo "USER_TOTP_SECRET=${{ secrets.USER_TOTP_SECRET }}" >> $GITHUB_ENV
        echo "USER_KEY=${{ secrets.USER_KEY }}" >> $GITHUB_ENV
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG before-run-tests"
        printf 'GERALT_DBG USER_EMAIL_set=%s\n' "${USER_EMAIL:+yes}"
        printf 'GERALT_DBG USER_PASSWORD_set=%s\n' "${USER_PASSWORD:+yes}"
        printf 'GERALT_DBG USER_TOTP_SECRET_set=%s\n' "${USER_TOTP_SECRET:+yes}"
        printf 'GERALT_DBG USER_KEY_set=%s\n' "${USER_KEY:+yes}"
        if [ -d apps/web ]; then
          echo "GERALT_DBG apps/web present"
          ls -a apps/web | head -n 40 || true
          if [ -f apps/web/playwright.config.ts ] || [ -f apps/web/playwright.config.js ]; then
            echo "GERALT_DBG playwright config present"
          else
            echo "GERALT_DBG playwright config not found (will search)"
            find apps/web -maxdepth 2 -iname 'playwright*' -print 2>/dev/null || true
          fi
        else
          echo "GERALT_DBG apps/web absent"
        fi
      continue-on-error: true
    - name: Run tests
      run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
      working-directory: apps/web
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  workflow_dispatch: null
  push:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
  pull_request_target:
    branches:
    - master
    paths:
    - apps/web/**
    - .github/workflows/web.tests.yml
    types:
    - ready_for_review
    - opened
    - synchronize
    - reopened
